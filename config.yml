# Цель — часов в месяц. В таблице времени делится поровну на все дни месяца.
norm_hours: 186
# Другая цель на отдельный месяц: "2026-12": 170
norm_overrides: {}

tracker:
  # Где искать выгрузки трекера (report-ДД-ММ-ГГГГ.csv). Пути от папки дневника или от ~.
  exports:
    - ~/Downloads/Telegram Lite/report-*.csv
    - ~/Downloads/Telegram Desktop/report-*.csv
    - inbox/*.csv
  # Группа рабочих записей. Всё остальное из выгрузки не читается и никуда не сохраняется.
  work_groups: [Ruby, Работа, Domcap]
  # «А портал» — пункт а) плана дня, «Б портал» — пункт б) и т. д.
  plan_letter: '\A([А-ЯЁ]) портал\z'
  # Остальные виды записей → пункт отчёта
  activities:
    Отчётность: отчётность
    Связь портал: связь с командой
    Документация: документация

plan:
  project: Domcap
  # Пункты после задач, если не из чего взять (обычно берутся из предыдущего плана)
  default_items: [отчётность, связь с командой, analysis, документация]

git:
  # Репозитории, по веткам и коммитам которых составляется план дня
  repos: [~/Work/Portal.Domcap]

telegram:
  # Моё имя в экспорте чата
  from_name: Ivan

# Ежемесячный отчёт
month_report: |-
  Здравствуйте! Отчёт за %{month_lower}:
  %{month} %{year}го
  Portal.Domcup %{total}
  Расчёт зарплаты уже в таблице
